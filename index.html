  color: c, emissive: c, emissiveIntensity: .35, transparent: true, opacity: .75, roughness: .15 }));

function makeBubble() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(bGeo, bMats[Math.random() * 4 | 0]));

    const e = new THREE.Mesh(eyeGeo, eyeMat); e.position.set(s * R * .3, R * .2, R * .82); g.add(e);

/* ───────────── Spawning onto the Charminar surface ───────────── */
const ray = new THREE.Raycaster(); ray.firstHitOnly = true;
function pickTarget() {
  const H = CFG.charminarHeight, c = CFG.charminarPos, tmp = new THREE.Vector3();
  const W = cmW;
  let best = null;
  for (let k = 0; k < 8; k++) {
    const az = (Math.random() * 2 - 1) * THREE.MathUtils.degToRad(CFG.frontArc);
    const lat = (Math.random() - .5) * W * .9, y = H * (.06 + Math.random() * .9);
    const origin = new THREE.Vector3(c.x + Math.sin(az) * 3 + Math.cos(az) * lat, y, c.z + Math.cos(az) * 3 - Math.sin(az) * lat);
    const dir = new THREE.Vector3(-Math.sin(az), 0, -Math.cos(az));
    ray.set(origin, dir);
    const hit = ray.intersectObject(rayTarget, true).find(h => h.face);
    if (!hit) continue;
    const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
    if (n.dot(dir) > 0) n.negate();

  }

}
function spawnBubble() {

  b.scale.setScalar(.2);

/* ───────────── Audio ───────────── */
let actx;

    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + step); });
}

}

      b.position.lerpVectors(u.from, u.to, e); b.position.y += Math.sin(Math.PI * k) * .2; b.scale.setScalar(.2 + .8 * e);
      if (k >= 1) { u.state = 'stuck'; cm.attach(b); } }
    else b.scale.setScalar(1 + .07 * Math.sin(time * 5 + u.phase));
  }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.v.y -= 2 * dt;
    p.m.position.addScaledVector(p.v, dt); p.m.scale.setScalar(Math.max(p.life / .5, .01));
    if (p.life <= 0) { scene.remove(p.m); parts.splice(i, 1); } }

  const show = state === 'menu' || ((state === 'won' || state === 'lost') && endReady);
  if (show && !btn.visible) btnReadyAt = time + .8;
  btn.visible = show; if (show) setLabel(state === 'menu' ? 'START' : 'PLAY AGAIN');
  if (show && time > btnReadyAt) { const bp = btn.getWorldPosition(new THREE.Vector3());
    for (let i = 0; i < nPok; i++) if (bp.distanceTo(pokers[i].p) < .1 + pokers[i].r) { audio(); buzz(pokers[i].src); startGame(); break; } }
  drawHUD();
}

/* ───────────── Desktop mouse fallback ───────────── */
renderer.domElement.addEventListener('click', e => {
  if (renderer.xr.isPresenting) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  if (btn.visible && ray.intersectObject(btn, true).length) { startGame(); return; }
  const hit = ray.intersectObjects(bubbles.map(b => b.children[0]))[0];
  if (hit && state === 'playing') pop(hit.object.parent);
});
renderer.xr.addEventListener('sessionstart', () => { orbit.enabled = false; audio(); });
renderer.xr.addEventListener('sessionend', () => { orbit.enabled = true; });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ───────────── Init ───────────── */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), .05); if (ready) update(dt, clock.elapsedTime); renderer.render(scene, camera); });
(async () => {
  const [a, b] = await Promise.all([loadModel(CFG.charminarFile), loadModel(CFG.ufoFile)]);
  const c = a || fallbackCharminar(); rot(c, CFG.charminarRot); cmModel = fit(c, CFG.charminarHeight, false); cm.add(cmModel);
  // Fast ray-casting: build a BVH per mesh (a raw ray test on a big FBX freezes the page)
  cmModel.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(cmModel), bs = bb.getSize(new THREE.Vector3()); cmW = bs.x; rayTarget = cmModel;
  let tris = 0;
  try {
    const B = await import('three-mesh-bvh');
    cmModel.traverse(o => { if (o.isMesh && o.geometry) {
      o.geometry.boundsTree = new B.MeshBVH(o.geometry, { maxLeafTris: 10 }); o.raycast = B.acceleratedRaycast;
      tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
    console.log('Charminar triangles:', Math.round(tris));
  } catch (e) {   // fallback: cheap box proxy so the game never freezes
    console.warn('BVH unavailable, using box proxy', e);
    rayTarget = new THREE.Mesh(new THREE.BoxGeometry(bs.x * .85, bs.y, bs.z * .85));
    rayTarget.position.copy(bb.getCenter(new THREE.Vector3())); rayTarget.updateMatrixWorld(true);
  }
  const u = b || fallbackUFO(); rot(u, CFG.ufoRot); ufoBody = fit(u, CFG.ufoWidth, true); ufo.add(ufoBody);
  document.getElementById('status').textContent =
    (a ? 'Charminar model loaded' : 'Charminar model not found – using placeholder') + ' · ' + (b ? 'UFO model loaded' : 'UFO model not found – using placeholder');
  scene.updateMatrixWorld(true); ready = true; setState('menu');
})();
</script>
